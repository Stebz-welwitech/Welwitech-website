# Force a lenient install (npm install) instead of the strict `npm ci`.
# The deploy image ships npm 9, which disagrees with the lockfile generated by
# npm 10/11 and wrongly reports packages "missing from lock file". `npm install`
# reconciles the lockfile at build time and avoids that false mismatch.
[phases.install]
cmds = ["npm install --no-audit --no-fund"]
